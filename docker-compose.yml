services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Backend (ASP.NET Core 8) ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/MsNhuFastEnglishAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: >-
        redis:6379,password=${REDIS_PASSWORD}
      Jwt__Key:      ${JWT_KEY}
      Jwt__Issuer:   ${JWT_ISSUER:-MsNhuApi}
      Jwt__Audience: ${JWT_AUDIENCE:-MsNhuClient}
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost}
      Smtp__Host:      ${SMTP_HOST}
      Smtp__Port:      ${SMTP_PORT:-587}
      Smtp__Username:  ${SMTP_USERNAME}
      Smtp__Password:  ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName:  ${SMTP_FROM_NAME:-MsNhu English}
      AppUrl:          ${FRONTEND_URL:-http://localhost}
      Seed__AdminEmail:    ${SEED_ADMIN_EMAIL:-admin@msnhu.com}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@123456}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey:    ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      PayOS__ClientId:       ${PAYOS_CLIENT_ID:-}
      PayOS__ApiKey:         ${PAYOS_API_KEY:-}
      PayOS__ChecksumKey:    ${PAYOS_CHECKSUM_KEY:-}
      VNPay__TmnCode:        ${VNPAY_TMN_CODE:-}
      VNPay__HashSecret:     ${VNPAY_HASH_SECRET:-}
      VNPay__Url:            ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../uploads:/app/wwwroot/uploads

  # ── Frontend (React + nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
